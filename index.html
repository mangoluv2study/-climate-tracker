<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣候訴訟追蹤系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;--bg2:#ffffff;--bg3:#f0ede6;
  --border:#e2ddd6;--border2:#c8c0b4;
  --green:#1a6b4a;--green-light:#e8f4ee;--green-mid:#2d8a5e;
  --text:#1c1a18;--text2:#5a5650;--text3:#9a948c;
  --amber:#b36a00;--amber-light:#fff3e0;
  --blue:#1a4a7a;--blue-light:#e8f0f8;
  --red:#8b1a1a;--red-light:#fdeaea;
  --purple:#4a1a6b;--purple-light:#f0e8f8;
  --teal:#0f6b5a;--teal-light:#e0f4f0;
  --mono:'DM Mono',monospace;
  --serif:'Noto Serif TC',serif;
  --lora:'Lora',serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--serif);min-height:100vh}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-icon{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px}
.logo-name{font-size:15px;font-weight:600}
.logo-en{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.08em}
.status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--green);background:var(--green-light);border:1px solid rgba(26,107,74,0.2);padding:4px 12px;border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

#list-view{max-width:1000px;margin:0 auto;padding:2rem}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem}
.metric-label{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px}
.metric-val{font-size:30px;font-weight:600;color:var(--green);line-height:1;margin-bottom:2px}
.metric-sub{font-size:12px;color:var(--text2)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{font-family:var(--mono);font-size:12px;padding:10px 20px;cursor:pointer;border:none;background:none;color:var(--text3);border-bottom:2px solid transparent;letter-spacing:0.05em;transition:color 0.2s}
.tab:hover{color:var(--text)}.tab.active{color:var(--green);border-bottom-color:var(--green)}

.search-row{display:flex;gap:8px;margin-bottom:1.25rem}
.search-row input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-family:var(--serif);font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s}
.search-row input:focus{border-color:var(--border2)}
.search-row input::placeholder{color:var(--text3)}

.panel{display:none}.panel.active{display:block}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:0.75rem;cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s;animation:fadeIn 0.25s ease forwards;opacity:0}
.card:hover{border-color:var(--border2);box-shadow:0 2px 12px rgba(0,0,0,0.06)}
@keyframes fadeIn{to{opacity:1}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.card-title{font-size:14px;font-weight:600;line-height:1.5;flex:1}
.card-date{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;margin-top:2px}
.card-summary{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;letter-spacing:0.04em;border:1px solid transparent;white-space:nowrap}
/* D1 被告身分 — 實心底色 + 白字 */
.tag-gov{background:#2563EB;color:#fff;border-color:#2563EB}
.tag-corp{background:#6D28D9;color:#fff;border-color:#6D28D9}
/* D2 法律訴由 — 有色邊框 + 淺底深字 */
.tag-tort{background:#fff;color:#991B1B;border:1.5px solid #EF4444}
.tag-rights{background:#fff;color:#92400E;border:1.5px solid #F59E0B}
.tag-admin{background:#fff;color:#065F46;border:1.5px solid #10B981}
/* 報導類型 — 實心底色白字 */
.tag-report-verdict{background:#DC2626;color:#fff;border-color:#DC2626}
.tag-report-law{background:#7C3AED;color:#fff;border-color:#7C3AED}
.tag-report-corp{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.tag-report-research{background:#0F766E;color:#fff;border-color:#0F766E}
.tag-report-intl{background:#B45309;color:#fff;border-color:#B45309}
/* D3 審理階段 — 深灰邊框白底 */
.tag-stage{background:#fff;color:#374151;border:1.5px solid #6B7280}
/* D4 環境議題 — 灰底極簡 */
.tag-topic{background:#F3F4F6;color:#374151;border-color:#E5E7EB}
.card-arrow{margin-left:auto;color:var(--text3);font-size:14px}
.status-btns{display:flex;gap:4px;margin-left:auto}
.sbtn{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text3);transition:all 0.15s;line-height:1.6}
.sbtn:hover{border-color:var(--border2)}
.sbtn-star{color:#b36a00;border-color:rgba(179,106,0,0.3);background:#fff3e0}
.sbtn-star.active{background:#b36a00;color:#fff;border-color:#b36a00}
.sbtn-done{color:#1a6b4a;border-color:rgba(26,107,74,0.3);background:#e8f4ee}
.sbtn-done.active{background:#1a6b4a;color:#fff;border-color:#1a6b4a}
.sbtn-invalid{color:#8b1a1a;border-color:rgba(139,26,26,0.3);background:#fdeaea}
.sbtn-invalid.active{background:#8b1a1a;color:#fff;border-color:#8b1a1a}
.filter-status{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.fsbtn{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);transition:all 0.15s}
.fsbtn.active{background:var(--text);color:var(--bg2);border-color:var(--text)}
.card.status-invalid{opacity:0.45}
.card.status-important{border-left:3px solid #b36a00}
.empty{text-align:center;padding:4rem;color:var(--text3);font-family:var(--mono);font-size:13px}
.loading{text-align:center;padding:4rem;color:var(--text3);font-family:var(--mono);font-size:13px}

.config-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.config-title{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1rem}
.config-row{display:flex;gap:8px;margin-bottom:8px}
.config-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text);outline:none}
.btn{background:var(--green-light);border:1px solid rgba(26,107,74,0.3);color:var(--green);font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(26,107,74,0.15)}
.config-note{font-size:12px;color:var(--text3);margin-top:8px}

/* ANALYTICS */
.analytics-header{margin-bottom:1.5rem}
.analytics-title{font-size:18px;font-weight:600;margin-bottom:4px}
.analytics-sub{font-size:13px;color:var(--text2)}
.filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-btn{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);transition:all 0.15s}
.filter-btn.active{background:var(--green);color:white;border-color:var(--green)}
.chart-section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1rem}
.chart-section-title{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1.25rem}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.bar-row:hover .bar-fill{opacity:0.8}
.bar-label{font-size:12px;color:var(--text);width:160px;flex-shrink:0;text-align:right;line-height:1.3}
.bar-track{flex:1;background:var(--bg3);border-radius:4px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;padding:0 8px}
.bar-count{font-family:var(--mono);font-size:11px;color:white;font-weight:500}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.cloud-tag{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;transition:all 0.15s;border:1px solid transparent}
.cloud-tag:hover{transform:translateY(-1px)}

/* DETAIL VIEW */
#detail-view{display:none}
.back-btn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--text3);cursor:pointer;margin-bottom:2rem;width:fit-content;padding:6px 12px;border-radius:6px;transition:background 0.2s}
.back-btn:hover{background:var(--bg3);color:var(--text)}
.detail-type-badge{margin-bottom:1rem}
.detail-title{font-family:var(--lora);font-size:24px;font-weight:600;line-height:1.4;margin-bottom:1rem}
.detail-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.section{margin-bottom:2rem}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.summary-item{background:var(--bg3);border-radius:8px;padding:1rem}
.summary-item-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
.summary-item-val{font-size:13px;color:var(--text);line-height:1.5}
.summary-full{background:var(--bg3);border-radius:8px;padding:1rem}
.summary-full-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px}
.summary-full-text{font-size:14px;color:var(--text2);line-height:1.75}
.source-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:12px}
.source-name{font-size:13px;font-weight:600;margin-bottom:2px}
.source-url{font-family:var(--mono);font-size:11px;color:var(--text3);word-break:break-all}
.source-link-btn{background:var(--green);color:white;font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:6px;text-decoration:none;white-space:nowrap;flex-shrink:0}
.source-link-btn:hover{background:var(--green-mid)}
.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.related-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s}
.related-card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.related-type{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.06em;margin-bottom:6px}
.related-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.related-tags{display:flex;gap:4px;flex-wrap:wrap}
.edit-btn{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:6px;cursor:pointer;background:var(--green-light);border:1px solid rgba(26,107,74,0.3);color:var(--green);transition:all 0.15s}
.edit-btn:hover{border-color:var(--border2);color:var(--text)}
.zotero-btn{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:6px;cursor:pointer;background:var(--blue-light);border:1px solid rgba(26,74,122,0.3);color:var(--blue);transition:all 0.15s}
.zotero-btn:hover{border-color:var(--border2);color:var(--text)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:520px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:1.25rem}
.modal-field{margin-bottom:1rem}
.modal-field label{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;display:block;margin-bottom:6px}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:var(--serif);font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s}
.modal-field input:focus,.modal-field textarea:focus,.modal-field select:focus{border-color:var(--border2)}
.modal-field textarea{resize:vertical;min-height:80px;line-height:1.6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.modal-save{background:var(--green);color:white;font-family:var(--mono);font-size:12px;padding:8px 20px;border-radius:6px;cursor:pointer;border:none}
.modal-save:hover{background:var(--green-mid)}
.modal-cancel{background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="showList()">
    <div class="logo-icon">⚖</div>
    <div><div class="logo-name">氣候訴訟追蹤</div><div class="logo-en">CLIMATE LITIGATION TRACKER</div></div>
  </div>
  <div class="status"><div class="dot"></div><span id="status-text">連線中...</span></div>
</header>

<div id="list-view">
  <div style="max-width:1000px;margin:0 auto;padding:2rem">
    <div class="metrics">
      <div class="metric"><div class="metric-label">最新新聞</div><div class="metric-val" id="count-news">—</div><div class="metric-sub">追蹤報導</div></div>
      <div class="metric"><div class="metric-label">訴訟案件</div><div class="metric-val" id="count-cases">—</div><div class="metric-sub">已收錄判決</div></div>
      <div class="metric"><div class="metric-label">最後更新</div><div class="metric-val" id="last-update" style="font-size:18px;padding-top:6px">—</div><div class="metric-sub">每日 08:00 自動爬取</div></div>
    </div>

    <div id="config-section" class="config-box">
      <div class="config-title">▸ Supabase 連線設定</div>
      <div class="config-row"><input id="input-url" type="text" placeholder="Supabase Project URL（https://xxxx.supabase.co）"></div>
      <div class="config-row">
        <input id="input-key" type="text" placeholder="Supabase anon key">
        <button class="btn" onclick="saveConfig()">連線 →</button>
      </div>
      <p class="config-note">設定儲存於瀏覽器，下次開啟自動連線，若發生同步失敗將重新顯示此區。</p>
    </div>

    <div id="zotero-config-section" class="config-box">
      <div class="config-title">▸ Zotero 設定</div>
      <div class="config-row"><input id="input-zotero-key" type="text" placeholder="Zotero API Key"></div>
      <div class="config-row"><input id="input-zotero-library-id" type="text" placeholder="Zotero Library ID（User ID）"></div>
      <div class="config-row">
        <input id="input-zotero-collection-key" type="text" placeholder="Zotero Collection Key（選填）">
        <button class="btn" onclick="saveZoteroConfig()">儲存 Zotero</button>
      </div>
      <p class="config-note">Zotero 設定儲存在 localStorage。若填入 Collection Key，轉存項目會放到該 Zotero 資料夾。</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('news')">最新新聞</button>
      <button class="tab" onclick="switchTab('cases')">訴訟案件</button>
      <button class="tab" onclick="switchTab('analytics')">關鍵字分析</button>
    </div>

    <div id="panel-news" class="panel active">
      <div class="search-row">
        <input type="text" id="search-news" placeholder="搜尋新聞..." oninput="filterNews()" style="flex:1">
        <select id="date-filter-news" onchange="filterNews()" style="font-family:var(--mono);font-size:12px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);outline:none">
          <option value="0">全部時間</option>
          <option value="7" selected>最近 7 天</option>
          <option value="14">最近 14 天</option>
          <option value="30">最近 30 天</option>
        </select>
      </div>
      <div class="filter-status">
        <button class="fsbtn active" onclick="setStatusFilter('news','all',this)">全部</button>
        <button class="fsbtn" onclick="setStatusFilter('news','unread',this)">未讀</button>
        <button class="fsbtn" onclick="setStatusFilter('news','important',this)">⭐ 重要</button>
        <button class="fsbtn" onclick="setStatusFilter('news','done',this)">✓ 已讀</button>
        <button class="fsbtn" onclick="setStatusFilter('news','invalid',this)">✗ 無效</button>
      </div>
      <div id="news-list"><div class="loading">載入中...</div></div>
    </div>

    <div id="panel-cases" class="panel">
      <div class="search-row"><input type="text" id="search-cases" placeholder="搜尋案件..." oninput="filterCases()"></div>
      <div class="filter-status">
        <button class="fsbtn active" onclick="setStatusFilter('cases','all',this)">全部</button>
        <button class="fsbtn" onclick="setStatusFilter('cases','unread',this)">未讀</button>
        <button class="fsbtn" onclick="setStatusFilter('cases','important',this)">⭐ 重要</button>
        <button class="fsbtn" onclick="setStatusFilter('cases','done',this)">✓ 已讀</button>
        <button class="fsbtn" onclick="setStatusFilter('cases','invalid',this)">✗ 無效</button>
      </div>
      <div id="cases-list"><div class="loading">載入中...</div></div>
    </div>

    <div id="panel-analytics" class="panel">
      <div class="analytics-header">
        <div class="analytics-title">事由關鍵字分析</div>
        <div class="analytics-sub">從所有新聞與案件摘要中自動統計出現頻率最高的議題詞彙</div>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setAnalyticsScope('all',this)">全部</button>
        <button class="filter-btn" onclick="setAnalyticsScope('news',this)">僅新聞</button>
        <button class="filter-btn" onclick="setAnalyticsScope('cases',this)">僅案件</button>
      </div>
      <div id="analytics-content"><div class="loading">載入中...</div></div>
    </div>
  </div>
</div>

<div id="detail-view">
  <div style="max-width:860px;margin:0 auto;padding:2rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem">
      <div class="back-btn" style="margin-bottom:0" onclick="showList()">← 返回列表</div>
      <button class="edit-btn" id="global-edit-btn" onclick="openEditModal(window.currentDetailType,window.currentDetailId)" style="display:none">✎ 編輯此筆資訊</button>
      <button class="edit-btn" id="global-move-btn" onclick="moveCaseToNews(window.currentDetailId)" style="display:none;background:var(--blue-light);border-color:rgba(26,74,122,0.3);color:var(--blue)">↗ 移到新聞</button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">編輯案件資訊</div>
    <input type="hidden" id="edit-type">
    <input type="hidden" id="edit-id">
    <div class="modal-field">
      <label>標題（繁體中文）</label>
      <input type="text" id="edit-title">
    </div>
    <div class="modal-field">
      <label>國家／地區</label>
      <input type="text" id="edit-country" placeholder="例如：台灣、美國、德國">
    </div>
    <div class="modal-field">
      <label>法院名稱</label>
      <input type="text" id="edit-court" placeholder="例如：台灣高等法院">
    </div>
    <div class="modal-field">
      <label>法律訴由</label>
      <select id="edit-legal-cause">
        <option value="侵權行為">侵權行為</option>
        <option value="違憲／人權">違憲／人權</option>
        <option value="行政不作為">行政不作為</option>
        <option value="刑事訴追">刑事訴追</option>
        <option value="資訊揭露">資訊揭露</option>
        <option value="不明">不明</option>
      </select>
    </div>
    <div class="modal-field">
      <label>審理階段</label>
      <select id="edit-court-stage">
        <option value="國際法院">國際法院</option>
        <option value="最高法院">最高法院</option>
        <option value="上訴審">上訴審</option>
        <option value="一審">一審</option>
        <option value="不明">不明</option>
      </select>

      <label>摘要</label>
      <textarea id="edit-summary"></textarea>

      <button class="modal-cancel" onclick="closeEditModal()">取消</button>
      <button class="modal-save" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<script>
let SB_URL='',SB_KEY='';
let allNews=[],allCases=[];
let analyticsScope='all';
let statusFilter={news:'all',cases:'all'};

// D1 被告身分
const D1=[
  {kw:['government','ministry','state','federal','municipal','政府','部會','國家','聯邦'],label:'政府被告',cls:'tag-gov'},
  {kw:['corporation','company','exxon','shell','bp','chevron','totalenergies','rwe','企業','公司'],label:'企業被告',cls:'tag-corp'},
  {kw:['bank','financial institution','finance','investment','銀行','金融機構'],label:'金融機構',cls:'tag-corp'},
];
// D2 法律訴由
const D2=[
  {kw:['tort','negligence','civil liability','damages','nuisance','侵權','損害賠償'],label:'侵權行為',cls:'tag-tort'},
  {kw:['constitutional','human rights','right to life','fundamental rights','憲法','人權','基本權利'],label:'違憲／人權',cls:'tag-rights'},
  {kw:['administrative','inaction','failure to act','regulation','permit','行政','不作為','監管'],label:'行政不作為',cls:'tag-admin'},
  {kw:['criminal','prosecution','fraud','刑事','起訴','詐欺'],label:'刑事訴追',cls:'tag-tort'},
];
// D3 審理階段
const D3=[
  {kw:['international court','icj','international tribunal','國際法院'],label:'國際法院'},
  {kw:['supreme court','最高法院','highest court'],label:'最高法院'},
  {kw:['appeals court','appellate','court of appeal','上訴法院','二審'],label:'上訴審'},
  {kw:['district court','trial court','first instance','地方法院','一審','地院'],label:'一審'},
];
// D4 環境議題
const D4=[
  {kw:['fossil fuel','fossil fuels','oil','petroleum','coal','化石燃料','石油','煤炭'],label:'# 石化燃料'},
  {kw:['greenhouse gas','carbon emission','co2','排放','溫室氣體'],label:'# 排放責任'},
  {kw:['net zero','carbon neutral','淨零','碳中和'],label:'# 淨零路徑'},
  {kw:['greenwashing','misleading','false claim','漂綠'],label:'# 漂綠'},
  {kw:['disclosure','transparency','揭露','資訊透明'],label:'# 資訊揭露'},
  {kw:['paris agreement','paris accord','巴黎協定'],label:'# 巴黎協定'},
  {kw:['esg','sustainability','sustainable','永續'],label:'# ESG永續'},
  {kw:['sea level','flooding','flood','海平面','洪水'],label:'# 洪災海升'},
  {kw:['wildfire','野火','forest fire'],label:'# 野火'},
  {kw:['indigenous','原住民'],label:'# 原住民族'},
  {kw:['youth','children','young','青年','兒童'],label:'# 青年訴訟'},
  {kw:['adaptation','resilience','調適'],label:'# 氣候調適'},
];
const KEYWORDS=[...D1,...D2,...D3.map(d=>({...d,cls:'tag-stage'})),...D4.map(d=>({...d,cls:'tag-topic'}))];

function extractTags(text){
  const t=(text||'').toLowerCase();
  const found=[];
  for(const k of KEYWORDS){
    if(k.kw.some(w=>t.includes(w))) found.push(k);
  }
  return found;
}
function extractD1(text){const t=(text||'').toLowerCase();for(const k of D1){if(k.kw.some(w=>t.includes(w)))return k;}return null;}
function extractD2(text){const t=(text||'').toLowerCase();for(const k of D2){if(k.kw.some(w=>t.includes(w)))return k;}return null;}
function extractD3(text){const t=(text||'').toLowerCase();for(const k of D3){if(k.kw.some(w=>t.includes(w)))return k;}return null;}
function extractD4s(text){const t=(text||'').toLowerCase();return D4.filter(k=>k.kw.some(w=>t.includes(w))).slice(0,2);}

function guessCountry(text){
  const t=(text||'').toLowerCase();
  const map=[
    ['united states','u.s.','america','trump','美國'],
    ['netherlands','荷蘭'],['germany','german','德國'],
    ['france','法國'],['uk','britain','英國'],
    ['australia','澳洲'],['canada','加拿大'],
    ['belgium','比利時'],['pacific','太平洋島國'],
    ['japan','日本'],['india','印度'],
    ['colombia','哥倫比亞'],['brazil','巴西'],
    ['european','歐盟'],
  ];
  for(const row of map){
    const label=row[row.length-1];
    if(row.slice(0,-1).some(k=>t.includes(k))) return label;
  }
  return null;
}

function guessStage(text){
  const t=(text||'').toLowerCase();
  if(t.includes('supreme court')||t.includes('最高法院')) return '最高法院審理';
  if(t.includes('appeal')||t.includes('上訴')) return '上訴審';
  if(t.includes('dismiss')||t.includes('rejected')) return '一審（駁回）';
  if(t.includes('filed')||t.includes('lawsuit')) return '起訴階段';
  if(t.includes('ruling')||t.includes('decision')||t.includes('判決')) return '判決確定';
  return '審理中';
}

function guessOutcome(text){
  const t=(text||'').toLowerCase();
  if(t.includes('dismissed')||t.includes('rejected')||t.includes('駁回')) return '敗訴／駁回';
  if(t.includes('upheld')||t.includes('won')||t.includes('victory')||t.includes('勝訴')) return '勝訴';
  if(t.includes('pending')) return '待決';
  if(t.includes('settled')||t.includes('和解')) return '和解';
  return '結果待定';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function saveConfig(){
  SB_URL=document.getElementById('input-url').value.trim().replace(/\/$/,'');
  SB_KEY=document.getElementById('input-key').value.trim();
  if(!SB_URL||!SB_KEY){alert('請填入 URL 和 key');return}
  localStorage.setItem('sb_url',SB_URL);localStorage.setItem('sb_key',SB_KEY);
  document.getElementById('config-section').style.display='none';
  loadData();
}

function loadConfig(){
  const u=localStorage.getItem('sb_url'),k=localStorage.getItem('sb_key');
  loadZoteroConfig();
  if(u&&k){
    SB_URL=u;
    SB_KEY=k;
    document.getElementById('input-url').value=u;
    document.getElementById('input-key').value=k;
    document.getElementById('config-section').style.display='none';
    loadData();
  }
}

function getZoteroConfig(){
  return {
    apiKey: localStorage.getItem('zotero_api_key')||'',
    libraryId: localStorage.getItem('zotero_library_id')||'',
    collectionKey: localStorage.getItem('zotero_collection_key')||''
  };
}

function saveZoteroConfig(){
  const apiKey=document.getElementById('input-zotero-key').value.trim();
  const libraryId=document.getElementById('input-zotero-library-id').value.trim();
  const collectionKey=document.getElementById('input-zotero-collection-key').value.trim();
  if(!apiKey||!libraryId){alert('請填入 Zotero API Key 與 Library ID');return}
  localStorage.setItem('zotero_api_key',apiKey);
  localStorage.setItem('zotero_library_id',libraryId);
  if(collectionKey) localStorage.setItem('zotero_collection_key',collectionKey);
  else localStorage.removeItem('zotero_collection_key');
  hideZoteroConfigIfReady();
  alert('Zotero 設定已儲存，設定區已隱藏。');
}

function loadZoteroConfig(){
  const cfg=getZoteroConfig();
  if(cfg.apiKey) document.getElementById('input-zotero-key').value=cfg.apiKey;
  if(cfg.libraryId) document.getElementById('input-zotero-library-id').value=cfg.libraryId;
  if(cfg.collectionKey) document.getElementById('input-zotero-collection-key').value=cfg.collectionKey;
  hideZoteroConfigIfReady();
}

function hideZoteroConfigIfReady(){
  const cfg=getZoteroConfig();
  document.getElementById('zotero-config-section').style.display = cfg.apiKey && cfg.libraryId ? 'none' : 'block';
}

async function pushDetailToZotero(){
  const cfg=getZoteroConfig();
  if(!cfg.apiKey||!cfg.libraryId){alert('請先在儀表板設定 Zotero API Key 與 Library ID');return}
  const item = window.currentDetailType==='news' ? allNews.find(n=>n.id===window.currentDetailId) : allCases.find(c=>c.id===window.currentDetailId);
  if(!item){alert('找不到目前項目');return}
  const title = item.headline||item.title||'未命名項目';
  const url = item.url||item.source_url||'';
  if(!url){alert('此項目沒有可用網址，無法推送到 Zotero。');return}
  const abstractNote = item.content_summary||item.summary||'';
  const source = item.source||item.report_type||'氣候訴訟追蹤';
  const tags = [];
  if(Array.isArray(item.topic_tags)) tags.push(...item.topic_tags);
  if(item.legal_cause && item.legal_cause!=='不明') tags.push(item.legal_cause);
  if(item.defendant_type && item.defendant_type!=='不明') tags.push(item.defendant_type);
  if(source) tags.push(source);
  const body=[{
    itemType:'webpage',
    title,
    url,
    abstractNote,
    libraryCatalog: source,
    publicationTitle: source,
    tags: tags.filter(Boolean).map(t=>({tag:t}))
  }];
  if(cfg.collectionKey){
    body[0].collections=[cfg.collectionKey];
  }
  try{
    const endpoint=`https://api.zotero.org/users/${encodeURIComponent(cfg.libraryId)}/items`;
    const resp=await fetch(endpoint,{method:'POST',headers:{'Zotero-API-Key':cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok){const text=await resp.text();throw new Error(`Zotero API 錯誤 ${resp.status} ${text}`)}
    alert('已成功儲存至 Zotero！');
  }catch(e){alert('推送 Zotero 失敗：'+e.message)}
}

async function fetchTable(t){
  const r=await fetch(`${SB_URL}/rest/v1/${t}?select=*&order=created_at.desc&limit=100`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function loadData(){
  document.getElementById('status-text').textContent='同步中...';
  try{
    const[news,cases]=await Promise.all([fetchTable('news'),fetchTable('cases')]);
    allNews=news;allCases=cases;
    document.getElementById('count-news').textContent=news.length;
    document.getElementById('count-cases').textContent=cases.length;
    const latest=news[0]||cases[0];
    if(latest){const d=new Date(latest.created_at);document.getElementById('last-update').textContent=d.toLocaleDateString('zh-TW',{month:'short',day:'numeric'})}
    document.getElementById('status-text').textContent='即時同步';
    filterNews();renderCases(allCases);renderAnalytics();
  }catch(e){
    document.getElementById('status-text').textContent='連線失敗';
    document.getElementById('config-section').style.display='block';
    console.error('Supabase 同步失敗', e);
    alert('Supabase 同步失敗，請檢查 Supabase URL / key 是否正確。');
  }
}

function defCls(v){return v&&v.includes('企業')||v&&v.includes('金融')?'tag-corp':v&&v.includes('政府')?'tag-gov':null;}
function reportCls(v){
  if(!v) return null;
  if(v.includes('判決')) return 'tag-report-verdict';
  if(v.includes('立法')) return 'tag-report-law';
  if(v.includes('企業')) return 'tag-report-corp';
  if(v.includes('學術')) return 'tag-report-research';
  if(v.includes('國際')) return 'tag-report-intl';
  return null;
}
function causeCls(v){
  if(!v||v==='不明') return null;
  if(v.includes('侵權')) return 'tag-tort';
  if(v.includes('違憲')||v.includes('人權')) return 'tag-rights';
  if(v.includes('行政')) return 'tag-admin';
  if(v.includes('刑事')) return 'tag-tort';
  return 'tag-admin';
}
function cardTags(item){
  const isNews=!!(item.headline);
  const topics=item.topic_tags||[];
  const text=(item.headline||item.title||'')+' '+(item.content_summary||item.summary||'');
  let html='';
  if(isNews){
    const rCls=reportCls(item.report_type);
    if(rCls&&item.report_type) html+=`<span class="tag ${rCls}">${item.report_type}</span>`;
    topics.slice(0,2).forEach(t=>{ html+=`<span class="tag tag-topic"># ${t}</span>`; });
  } else {
    const d1cls=defCls(item.defendant_type);
    const d2cls=causeCls(item.legal_cause);
    const stage=item.court_stage;
    const fd1=!d1cls?extractD1(text):null;
    const fd2=!d2cls?extractD2(text):null;
    const fd3=!stage||stage==='不明'?extractD3(text):null;
    const fd4s=topics.length===0?extractD4s(text):[];
    if(d1cls) html+=`<span class="tag ${d1cls}">${item.defendant_type}</span>`;
    else if(fd1) html+=`<span class="tag ${fd1.cls}">${fd1.label}</span>`;
    if(d2cls) html+=`<span class="tag ${d2cls}">${item.legal_cause}</span>`;
    else if(fd2) html+=`<span class="tag ${fd2.cls}">${fd2.label}</span>`;
    if(stage&&stage!=='不明') html+=`<span class="tag tag-stage">${stage}</span>`;
    else if(fd3) html+=`<span class="tag tag-stage">${fd3.label}</span>`;
    if(topics.length) topics.slice(0,2).forEach(t=>{ html+=`<span class="tag tag-topic"># ${t}</span>`; });
    else fd4s.forEach(d=>{ html+=`<span class="tag tag-topic">${d.label}</span>`; });
  }
  return html;
}

function renderNews(items){
  const el=document.getElementById('news-list');
  const sf=statusFilter.news;
  const filtered=sf==='all'?items:items.filter(n=>(n.status||'unread')===sf);
  if(!filtered.length){el.innerHTML='<div class="empty">沒有符合條件的資料</div>';return}
  // sort: invalid goes to bottom
  filtered.sort((a,b)=>{
    const aInvalid=(a.status||'unread')==='invalid';
    const bInvalid=(b.status||'unread')==='invalid';
    if(aInvalid&&!bInvalid) return 1;
    if(!aInvalid&&bInvalid) return -1;
    return 0;
  });
  el.innerHTML=filtered.map((n,i)=>`
    <div class="card status-${n.status||'unread'}" style="animation-delay:${i*0.03}s">
      <div class="card-head" onclick="showDetail('news',${n.id})" style="cursor:pointer">
        <div class="card-title">${esc(n.headline)}</div>
        <div class="card-date">${n.published_date||''}</div>
      </div>
      <div class="card-summary" onclick="showDetail('news',${n.id})" style="cursor:pointer">${esc(n.content_summary||'')}</div>
      <div class="card-foot">
        ${cardTags(n)}
        <div class="status-btns" onclick="event.stopPropagation()">
          <button class="sbtn sbtn-star${(n.status||'unread')==='important'?' active':''}" onclick="setStatus('news',${n.id},'important',this)" title="重要">⭐</button>
          <button class="sbtn sbtn-done${(n.status||'unread')==='done'?' active':''}" onclick="setStatus('news',${n.id},'done',this)" title="已讀">✓</button>
          <button class="sbtn sbtn-invalid${(n.status||'unread')==='invalid'?' active':''}" onclick="setStatus('news',${n.id},'invalid',this)" title="無效">✗</button>
          ${(n.status||'unread')==='invalid'?`<button class="sbtn" onclick="deleteItem('news',`+n.id+`,event)" style="color:#8b1a1a;border-color:rgba(139,26,26,0.5)" title="刪除">🗑</button>`:''}
        </div>
      </div>
    </div>`).join('');
}

function renderCases(items){
  const el=document.getElementById('cases-list');
  const sf=statusFilter.cases;
  const filtered=sf==='all'?items:items.filter(c=>(c.status||'unread')===sf);
  if(!filtered.length){el.innerHTML='<div class="empty">沒有符合條件的資料</div>';return}
  filtered.sort((a,b)=>{
    const aInvalid=(a.status||'unread')==='invalid';
    const bInvalid=(b.status||'unread')==='invalid';
    if(aInvalid&&!bInvalid) return 1;
    if(!aInvalid&&bInvalid) return -1;
    return 0;
  });
  el.innerHTML=filtered.map((c,i)=>`
    <div class="card status-${c.status||'unread'}" style="animation-delay:${i*0.03}s">
      <div class="card-head" onclick="showDetail('case',${c.id})" style="cursor:pointer">
        <div class="card-title">${esc(c.title)}</div>
        <div class="card-date">${c.date_decided||c.created_at?.slice(0,10)||''}</div>
      </div>
      <div class="card-summary" onclick="showDetail('case',${c.id})" style="cursor:pointer">${esc(c.summary||'')}</div>
      <div class="card-foot">
        ${cardTags(c)}
        <div class="status-btns" onclick="event.stopPropagation()">
          <button class="sbtn sbtn-star${(c.status||'unread')==='important'?' active':''}" onclick="setStatus('cases',${c.id},'important',this)" title="重要">⭐</button>
          <button class="sbtn sbtn-done${(c.status||'unread')==='done'?' active':''}" onclick="setStatus('cases',${c.id},'done',this)" title="已讀">✓</button>
          <button class="sbtn sbtn-invalid${(c.status||'unread')==='invalid'?' active':''}" onclick="setStatus('cases',${c.id},'invalid',this)" title="無效">✗</button>
          ${(c.status||'unread')==='invalid'?`<button class="sbtn" onclick="deleteItem('cases',`+c.id+`,event)" style="color:#8b1a1a;border-color:rgba(139,26,26,0.5)" title="刪除">🗑</button>`:''}
        </div>
      </div>
    </div>`).join('');
}

function filterNews(){
  const q=document.getElementById('search-news').value.toLowerCase();
  const days=parseInt(document.getElementById('date-filter-news')?.value||'0');
  let items=allNews;
  if(days>0){
    const cutoff=new Date();
    cutoff.setDate(cutoff.getDate()-days);
    items=items.filter(n=>{
      if(!n.published_date) return true;
      return new Date(n.published_date)>=cutoff;
    });
  }
  if(q) items=items.filter(n=>(n.headline+n.content_summary).toLowerCase().includes(q));
  renderNews(items);
}
function filterCases(){
  const q=document.getElementById('search-cases').value.toLowerCase();
  renderCases(q?allCases.filter(c=>(c.title+c.summary).toLowerCase().includes(q)):allCases);
}

function setAnalyticsScope(scope,btn){
  analyticsScope=scope;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAnalytics();
}

function renderAnalytics(){
  const pool = analyticsScope==='news' ? allNews : analyticsScope==='cases' ? allCases : [...allNews,...allCases];
  if(!pool.length){document.getElementById('analytics-content').innerHTML='<div class="empty">尚無資料</div>';return}

  // count keyword hits
  const counts={};
  for(const item of pool){
    const text=(item.headline||item.title||'')+' '+(item.content_summary||item.summary||'');
    const tags=extractTags(text);
    for(const t of tags){
      counts[t.label]=counts[t.label]||{count:0,cls:t.cls,items:[]};
      counts[t.label].count++;
      counts[t.label].items.push(item);
    }
  }

  const sorted=Object.entries(counts).sort((a,b)=>b[1].count-a[1].count);
  if(!sorted.length){document.getElementById('analytics-content').innerHTML='<div class="empty">未找到關鍵詞</div>';return}

  const max=sorted[0][1].count;
  const dimColor={'tag-gov':'#2563EB','tag-corp':'#6D28D9','tag-tort':'#EF4444','tag-rights':'#F59E0B','tag-admin':'#10B981','tag-stage':'#6B7280','tag-topic':'#9CA3AF'};

  const barsHTML=sorted.slice(0,15).map(([label,{count,cls,items}],i)=>{
    const pct=Math.round(count/max*100);
    const color=dimColor[cls]||'#9CA3AF';
    return`<div class="bar-row" onclick="filterByKeyword('${label}')">
      <div class="bar-label">${esc(label)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${color}">
          <span class="bar-count">${count}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  const dimColor2={'tag-gov':'#2563EB','tag-corp':'#6D28D9','tag-tort':'#EF4444','tag-rights':'#F59E0B','tag-admin':'#10B981','tag-stage':'#6B7280','tag-topic':'#9CA3AF'};
  const cloudHTML=sorted.map(([label,{count,cls}])=>{
    const size=Math.max(11,Math.min(18,11+Math.round(count/max*7)));
    const col=dimColor2[cls]||'#6B7280';
    return`<span class="cloud-tag tag-topic" style="font-size:${size}px;color:${col};border-color:${col}22" onclick="filterByKeyword('${label}')">${esc(label)} <span style="opacity:0.5">${count}</span></span>`;
  }).join('');

  document.getElementById('analytics-content').innerHTML=`
    <div class="chart-section">
      <div class="chart-section-title">出現頻率排行（前15名）— 點擊可篩選</div>
      ${barsHTML}
    </div>
    <div class="chart-section">
      <div class="chart-section-title">關鍵字雲 — 點擊可篩選</div>
      <div class="tag-cloud">${cloudHTML}</div>
    </div>
  `;
}

function filterByKeyword(label){
  const kw=KEYWORDS.find(k=>k.label===label);
  if(!kw) return;
  const matchNews=allNews.filter(n=>{
    const t=(n.headline+n.content_summary).toLowerCase();
    return kw.kw.some(w=>t.includes(w));
  });
  const matchCases=allCases.filter(c=>{
    const t=(c.title+c.summary).toLowerCase();
    return kw.kw.some(w=>t.includes(w));
  });
  // switch to news tab and show filtered
  switchTab('news');
  renderNews(matchNews);
  renderCases(matchCases);
  document.getElementById('search-news').value=label;
  document.getElementById('search-cases').value=label;
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['news','cases','analytics'][i]===tab));
  ['panel-news','panel-cases','panel-analytics'].forEach(id=>document.getElementById(id).classList.toggle('active',id==='panel-'+tab));
}

function showDetail(type,id){
  const item=type==='news'?allNews.find(n=>n.id===id):allCases.find(c=>c.id===id);
  if(!item) return;
  const text=(item.headline||item.title||'')+' '+(item.content_summary||item.summary||'');
  const d1cls=defCls(item.defendant_type);
  const d2cls=causeCls(item.legal_cause);
  const stage=item.court_stage;
  const topics=item.topic_tags||[];
  const country=item.country||guessCountry(text);
  const title=item.headline||item.title||'';
  const summary=item.content_summary||item.summary||'';
  const url=item.url||item.source_url||'';
  const source=item.source||'來源';
  const date=item.published_date||item.date_decided||item.created_at?.slice(0,10)||'';

  const pool=[...allCases.filter(c=>c.id!==id),...allNews.filter(n=>n.id!==id)];
  const related=pool.filter(r=>{
    return item.legal_cause && item.legal_cause!=='不明' && r.legal_cause===item.legal_cause;
  }).slice(0,4);

  let badgeHtml='';
  if(d1cls) badgeHtml+=`<span class="tag ${d1cls}" style="margin-right:6px">${item.defendant_type}</span>`;
  if(d2cls) badgeHtml+=`<span class="tag ${d2cls}" style="margin-right:6px">${item.legal_cause}</span>`;
  if(stage&&stage!=='不明') badgeHtml+=`<span class="tag tag-stage" style="margin-right:6px">${stage}</span>`;
  topics.forEach(t=>{ badgeHtml+=`<span class="tag tag-topic" style="margin-right:6px"># ${t}</span>`; });
  window.currentDetailType=type; window.currentDetailId=id;
  document.getElementById('detail-content').innerHTML=`
    <div class="detail-type-badge">${badgeHtml}</div>
    <div class="detail-title">${esc(title)}</div>
    <div class="detail-meta-row">
      ${country?`<span class="tag tag-blue">${country}</span>`:''}
      ${date?`<span class="tag tag-amber">${esc(date)}</span>`:''}
      <span class="tag tag-green">${type==='news'?'新聞報導':'訴訟案件'}</span>
    </div>
    <div class="section">
      <div class="section-label" style="display:flex;align-items:center">${type==='news'?'報導資訊':'案件摘要'}</div>
      <div class="summary-grid">
        ${type==='news'?`
        <div class="summary-item"><div class="summary-item-label">涉及國家</div><div class="summary-item-val">${country||'不明'}</div></div>
        <div class="summary-item"><div class="summary-item-label">新聞來源</div><div class="summary-item-val">${esc(source)}</div></div>
        <div class="summary-item"><div class="summary-item-label">報導類型</div><div class="summary-item-val">${item.report_type||'不明'}</div></div>
        <div class="summary-item"><div class="summary-item-label">發布日期</div><div class="summary-item-val">${date}</div></div>
        `:`
        <div class="summary-item"><div class="summary-item-label">涉及國家／地區</div><div class="summary-item-val">${country||'不明'}</div></div>
        <div class="summary-item"><div class="summary-item-label">法律訴由</div><div class="summary-item-val">${item.legal_cause&&item.legal_cause!=='不明'?item.legal_cause:'不明'}</div></div>
        <div class="summary-item"><div class="summary-item-label">審理階段</div><div class="summary-item-val">${stage&&stage!=='不明'?stage:'不明'}</div></div>
        <div class="summary-item"><div class="summary-item-label">判決結果</div><div class="summary-item-val">${guessOutcome(summary)}</div></div>
        `}
      </div>
      <div class="summary-full">
        <div class="summary-full-label">Claude AI 摘要（繁體中文）</div>
        <div class="summary-full-text">${esc(summary)||'（無摘要）'}</div>
      </div>
    </div>
    ${url?`<div class="section">
      <div class="section-label">原文來源</div>
      <div class="source-box">
        <div><div class="source-name">${esc(source.replace(' - Google News',''))}</div><div class="source-url">${esc(url)}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <a class="source-link-btn" href="${esc(url)}" target="_blank">前往原文 →</a>
          <button class="zotero-btn" onclick="pushDetailToZotero()">存入 Zotero</button>
        </div>
      </div>
    </div>`:''}
    ${related.length?`<div class="section">
      <div class="section-label">相關閱讀（同為「${item.legal_cause&&item.legal_cause!=='不明'?item.legal_cause:'相同議題'}」）</div>
      <div class="related-grid">
        ${related.map(r=>{
          const rtext=(r.headline||r.title||'')+' '+(r.content_summary||r.summary||'');
          const rtype=r.headline?'news':'case';
          return`<div class="related-card" onclick="showDetail('${rtype}',${r.id})">
            <div class="related-type">${rtype==='news'?'新聞報導':'訴訟案件'}</div>
            <div class="related-title">${esc(r.headline||r.title||'')}</div>
            <div class="related-tags">${[r.defendant_type&&r.defendant_type!=='不明'?`<span class="tag ${defCls(r.defendant_type)||'tag-gov'}" style="font-size:10px">${r.defendant_type}</span>`:'', r.legal_cause&&r.legal_cause!=='不明'?`<span class="tag ${causeCls(r.legal_cause)||'tag-admin'}" style="font-size:10px">${r.legal_cause}</span>`:''].filter(Boolean).join('')}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''}
  `;
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  const editBtn=document.getElementById('global-edit-btn');
  if(editBtn) editBtn.style.display='block';
  const moveBtn=document.getElementById('global-move-btn');
  if(moveBtn) moveBtn.style.display=type==='case'?'block':'none';
  window.scrollTo(0,0);
}

async function setStatus(table,id,newStatus,btn){
  const dbTable=table==='news'?'news':'cases';
  const arr=table==='news'?allNews:allCases;
  const item=arr.find(x=>x.id===id);
  if(!item) return;
  const prevStatus=item.status||'unread';
  const finalStatus=prevStatus===newStatus?'unread':newStatus;
  try{
    await fetch(`${SB_URL}/rest/v1/${dbTable}?id=eq.${id}`,{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({status:finalStatus})
    });
    item.status=finalStatus;
    if(table==='news') renderNews(allNews);
    else renderCases(allCases);
  }catch(e){console.error(e)}
}

function setStatusFilter(tab,val,btn){
  statusFilter[tab]=val;
  const parent=btn.closest('.filter-status');
  parent.querySelectorAll('.fsbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='news') renderNews(allNews);
  else renderCases(allCases);
}

function openEditModal(type, id){
  if(!type) type=window.currentDetailType;
  if(!id) id=window.currentDetailId;
  const item = type==='news' ? allNews.find(n=>n.id===id) : allCases.find(c=>c.id===id);
  if(!item) return;
  document.getElementById('edit-type').value = type;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-title').value = item.headline||item.title||'';
  document.getElementById('edit-country').value = item.country||'';
  document.getElementById('edit-court').value = item.court||'';
  document.getElementById('edit-legal-cause').value = item.legal_cause||'不明';
  document.getElementById('edit-court-stage').value = item.court_stage||'不明';
  document.getElementById('edit-summary').value = item.content_summary||item.summary||'';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal(){
  document.getElementById('edit-modal').classList.remove('open');
}

async function saveEdit(){
  const type = document.getElementById('edit-type').value;
  const id = parseInt(document.getElementById('edit-id').value);
  const dbTable = type==='news' ? 'news' : 'cases';
  const arr = type==='news' ? allNews : allCases;
  const item = arr.find(x=>x.id===id);
  if(!item) return;

  const titleVal = document.getElementById('edit-title').value.trim();
  const updates = {
    country: document.getElementById('edit-country').value.trim(),
    court: document.getElementById('edit-court').value.trim(),
    legal_cause: document.getElementById('edit-legal-cause').value,
    court_stage: document.getElementById('edit-court-stage').value,
  };

  if(type==='news'){
    updates.headline = titleVal;
    updates.content_summary = document.getElementById('edit-summary').value.trim();
  } else {
    updates.title = titleVal;
    updates.summary = document.getElementById('edit-summary').value.trim();
  }

  try{
    const resp = await fetch(`${SB_URL}/rest/v1/${dbTable}?id=eq.${id}`,{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify(updates)
    });
    if(resp.ok || resp.status===204){
      Object.assign(item, updates);
      closeEditModal();
      // force re-render with updated data
      const t=window.currentDetailType;
      const i=window.currentDetailId;
      setTimeout(()=>showDetail(t,i), 100);
    } else {
      const errText = await resp.text();
      alert('儲存失敗：' + resp.status + ' ' + errText);
    }
  } catch(e){
    alert('儲存失敗：'+e.message);
  }
}

async function moveCaseToNews(id){
  const item=allCases.find(c=>c.id===id);
  if(!item) return;
  if(!confirm('確定要將此案件移到新聞列表嗎？')) return;
  try{
    // Insert into news table
    const newsRow={
      headline: item.title,
      original_headline: item.original_title||item.title,
      source: '手動分類',
      published_date: item.created_at?.slice(0,10)||new Date().toISOString().slice(0,10),
      url: item.source_url||item.full_text_url||'',
      content_summary: item.summary||'',
      country: item.country||'',
      report_type: '',
      item_type: 'news',
      defendant_type: item.defendant_type||'不明',
      legal_cause: item.legal_cause||'不明',
      court_stage: item.court_stage||'不明',
      topic_tags: item.topic_tags||[],
      tags: ['climate','litigation','news','moved']
    };
    await fetch(`${SB_URL}/rest/v1/news`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(newsRow)
    });
    // Delete from cases
    await fetch(`${SB_URL}/rest/v1/cases?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    allCases=allCases.filter(c=>c.id!==id);
    document.getElementById('count-cases').textContent=allCases.length;
    // Reload news
    const r=await fetch(`${SB_URL}/rest/v1/news?select=*&order=created_at.desc&limit=100`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    allNews=await r.json();
    document.getElementById('count-news').textContent=allNews.length;
    showList();
    alert('已移到新聞列表！');
  } catch(e){
    alert('移動失敗：'+e.message);
  }
}

async function deleteItem(table, id, event){
  event.stopPropagation();
  if(!confirm('確定要刪除這筆資料嗎？此操作無法復原。')) return;
  try{
    await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    if(table==='news'){
      allNews=allNews.filter(n=>n.id!==id);
      renderNews(allNews);
      document.getElementById('count-news').textContent=allNews.length;
    } else {
      allCases=allCases.filter(c=>c.id!==id);
      renderCases(allCases);
      document.getElementById('count-cases').textContent=allCases.length;
    }
  } catch(e){
    alert('刪除失敗：'+e.message);
  }
}

function showList(){
  document.getElementById('list-view').style.display='block';
  document.getElementById('detail-view').style.display='none';
  const btn=document.getElementById('global-edit-btn');
  if(btn) btn.style.display='none';
  const mBtn=document.getElementById('global-move-btn');
  if(mBtn) mBtn.style.display='none';
  window.scrollTo(0,0);
}

loadConfig();
</script>
